name: Colony offline tests
on:
  pull_request:
    paths: ['code/**', 'tests/**', 'tools/**', '.github/workflows/colony-tests.yml']
  push:
    branches: ['feature/colony-bootstrap', 'fix/pioneer-support-observability', 'codex/optimize-*']
    paths: ['code/**', 'tests/**', 'tools/**', '.github/workflows/colony-tests.yml']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/check-syntax.js
      - run: node tests/expansion.test.js
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
